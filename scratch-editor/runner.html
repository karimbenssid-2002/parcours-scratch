<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Exécution</title>
<style>html,body,#app{margin:0;width:480px;height:360px;overflow:hidden}</style></head>
<body><div id="app"></div>
<script src="scratch-gui-standalone.js"></script>
<script>
(function () {
  var G = window.GUI, app = document.getElementById('app')
  G.setAppElement(app)
  var state = new G.EditorState({ locale: 'fr', isPlayerOnly: true })
  G.createStandaloneRoot(state, app).render({ isPlayerOnly: true, canSave: false, canEditTitle: false, showComingSoon: false, backpackVisible: false })
  function vm() { return state.store.getState().scratchGui.vm }

  // Hasard à graine (mulberry32) : élève et solution reçoivent la même suite.
  var seed = 1
  Math.random = function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 }

  var trace, answers, answerIndex, t0
  function now() { return Math.round(performance.now() - t0) }
  function name(target) { return target.isStage ? 'Scène' : target.getName() }

  function instrument(runtime) {
    runtime.on('SAY', function (target, type, text) { if (text !== '') trace.says.push({ sprite: name(target), text: String(text), t: now() }) })
    runtime.on('QUESTION', function (question) {
      if (question === null) return
      var answer = answers.length ? answers[answerIndex++ % answers.length] : ''
      var sprite = 'Scène', text = question
      // Question posée par un lutin : le texte part dans une bulle (« SAY ») juste avant, et QUESTION arrive vide.
      if (question === '' && trace.says.length) { var last = trace.says.pop(); sprite = last.sprite; text = last.text }
      trace.questions.push({ sprite: sprite, text: text, answer: answer })
      setTimeout(function () { runtime.emit('ANSWER', answer) }, 0)
    })
    // Le moteur de rendu reste le même d'une exécution à l'autre : il n'est enveloppé qu'une fois, et les enveloppes
    // écrivent dans la trace courante (remise à zéro par start). Sinon elles s'empilent : 6, 12, 18… tracés au lieu de 6.
    var r = runtime.renderer
    if (!r.__penWrapped) {
      var line = r.penLine.bind(r), point = r.penPoint.bind(r)
      r.penLine = function (skin, attrs, x0, y0, x1, y1) { record(x0, y0); record(x1, y1); trace.pen.lines++; trace.pen.parts.push([x0, y0, x1, y1].map(Math.round).join(',')); return line(skin, attrs, x0, y0, x1, y1) }
      r.penPoint = function (skin, attrs, x, y) { record(x, y); trace.pen.parts.push([x, y].map(Math.round).join(',')); return point(skin, attrs, x, y) }
      r.__penWrapped = true
    }
    function record(x, y) { var b = trace.pen.bbox; trace.pen.bbox = b ? [Math.min(b[0], x), Math.min(b[1], y), Math.max(b[2], x), Math.max(b[3], y)] : [x, y, x, y] }
    function watch(target) {
      function costumeName() { var c = target.getCostumes()[target.currentCostume]; return c ? c.name : null }
      var last = costumeName()
      target.on('EVENT_TARGET_VISUAL_CHANGE', function () {
        // Les lutins d'un projet précédent émettent encore pendant leur destruction (rechargement) : on les ignore.
        if (runtime.targets.indexOf(target) === -1) return
        var c = costumeName()
        if (c !== null && c !== last) { last = c; trace.costumeChanges.push({ sprite: name(target), costume: c, t: now() }) }
      })
      var bank = target.sprite.soundBank
      if (bank && !bank.__wrapped) {
        var play = bank.playSound.bind(bank)
        bank.playSound = function (t, soundId) {
          var s = t.sprite.sounds.find(function (x) { return x.soundId === soundId })
          trace.sounds.push({ sprite: name(t), sound: s ? s.name : soundId, t: now() })
          return play(t, soundId)
        }
        bank.__wrapped = true
      }
    }
    runtime.targets.forEach(watch)
    runtime.on('targetWasCreated', watch)
  }

  window.runner = {
    ready: false,
    // Charge le projet (Uint8Array en base64) ; renvoie null ou un message d'erreur.
    load: async function (base64) {
      var bytes = Uint8Array.from(atob(base64), function (c) { return c.charCodeAt(0) })
      try { await vm().loadProject(bytes.buffer) } catch (e) { return String(e && e.message || e) }
      return null
    },
    start: function (s, answerList) {
      seed = s; answers = answerList; answerIndex = 0; t0 = performance.now()
      trace = { says: [], questions: [], costumeChanges: [], sounds: [], pen: { parts: [], bbox: null, lines: 0 } }
      var runtime = vm().runtime
      // En mode lecteur sans interface, la VM n'est pas démarrée : sans cela, aucun script n'avance.
      if (!runtime._steppingInterval) vm().start()
      // Horloge simulée : le temps ne s'écoule pas pendant une étape, et le séquenceur boucle tant que 75 % d'une image
      // ne sont pas « écoulés ». On compte les itérations à la place : une étape se termine toujours.
      var seqTimer = runtime.sequencer.timer, ticks = 0
      seqTimer.start = function () { ticks = 0 }
      seqTimer.timeElapsed = function () { return ticks++ }
      runtime.removeAllListeners('SAY'); runtime.removeAllListeners('QUESTION'); runtime.removeAllListeners('targetWasCreated')
      instrument(runtime)
      vm().greenFlag()
    },
    key: function (key, isDown) { vm().postIOData('keyboard', { key: key, isDown: isDown }) },
    running: function () { return vm().runtime.threads.some(function (th) { return th.status !== 4 }) }, // 4 = STATUS_DONE
    finish: function () {
      var rt = vm().runtime
      vm().stopAll()
      var variables = {}, lists = {}
      rt.targets.filter(function (t) { return t.isOriginal }).forEach(function (t) {
        Object.values(t.variables).forEach(function (v) {
          var key = (t.isStage ? '' : name(t) + '.') + v.name
          if (v.type === 'list') lists[key] = v.value.slice(0, 200); else if (v.type === '') variables[key] = v.value
        })
      })
      var sprites = rt.targets.filter(function (t) { return !t.isStage && t.isOriginal }).map(function (t) {
        return { name: name(t), x: Math.round(t.x), y: Math.round(t.y), direction: Math.round(t.direction), visible: t.visible, costume: t.getCostumes()[t.currentCostume].name, size: Math.round(t.size) }
      })
      return { says: trace.says, questions: trace.questions, costumeChanges: trace.costumeChanges, sounds: trace.sounds,
        variables: variables, lists: lists, sprites: sprites, penParts: trace.pen.parts, penBbox: trace.pen.bbox, penLines: trace.pen.lines }
    },
    projectJson: function () { return vm().toJSON() },
  }
  ;(function waitVm() { if (!vm()) return setTimeout(waitVm, 20); window.runner.ready = true })()
})()
</script></body></html>
